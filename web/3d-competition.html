<style>* { touch-action: manipulation; }</style>
<script>
  for (const t of ["gesturestart", "gesturechange", "dblclick"]) document.addEventListener(t, e => e.preventDefault(), { passive: false }) // iOS pinch + double-tap
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 && !(e.target instanceof HTMLCanvasElement)) e.preventDefault() }, { passive: false }) // two thumbs on the buttons is not a pinch
</script>
<title>Sheep PoC — 3D · Competition</title>
<!--
  3D VIEW of the sheep PoC (three.js). Same simulation, different renderer.

  · §0 PARAMS + §1 SIM are lib/sheep-sim.js — the same file 2d.html loads, so
    there is one copy of the physics. The raw-param panels are lib/sheep-gui.js.
  · §2 RENDER / §3 INPUT / §4 BOOTSTRAP below are this file's own: a three.js
    scene that only READS sim state (positions, facings, flags). No sim logic.
  · Runs from file:// by double-click, like the 2D page. three.js is an ES
    module, so the 3D half is an inline <script type="module"> importing from
    the CDN (inline modules + CORS-enabled CDN imports are allowed on file://);
    the libs stay plain <script>s so their globals are shared (a LOCAL module
    file could not be imported from file:// at all).
  · World mapping: sim (x, y) px → world (x, 0, y); 1 px = 1 unit; +Y is up.
    Seen from above with north (sim −y) at the top it matches the 2D canvas —
    come by is still clockwise.
  · URL knobs: ?seed=42 pins the course, ?cam=orbit|top|handler|dog picks the
    starting camera.
-->
<style>

// no special sheep) with 4–6 numbered drive gates on a required path, a small flock, then the pen (lib/sheep-sim.js CC1–CC6).

<script>
// A blocked CDN / offline load would otherwise leave a blank stage with the
// error only in the console — say it on the page.
window.addEventListener('error', (ev) => {
  const el = document.getElementById('boot-error')
  if (!el || window.__sheep3dBooted) return
  el.style.display = 'block'
  el.textContent = 'The 3D view failed to start.\n\n' + (ev.message || 'A script failed to load (three.js comes from cdn.jsdelivr.net — is the network reachable?).')
}, true)

<script type="module">
// ============================================================================
// §2 RENDER (3D) — three.js scene that READS the sim. [throwaway]
//   Nothing here writes sim state. Render-only liberties, all cosmetic:
//   · smoothed turning, leg/head animation, the dog's body following his
//     travel while his head holds the eye;
//   · penned sheep walk on from the sim's settle line to a free spot in a
//     fenced paddock (the sim parks them all on one line — fine as 2D
//     triangles, a pile-up as 3D bodies).
// ============================================================================
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js'

const V3 = THREE.Vector3, M4 = THREE.Matrix4, Quat = THREE.Quaternion
const AX_X = new V3(1, 0, 0), AX_Y = new V3(0, 1, 0), AX_Z = new V3(0, 0, 1), ONE = new V3(1, 1, 1)
const lerp = THREE.MathUtils.lerp
const clamp01 = (v) => Math.max(0, Math.min(1, v))
const ease = (rate, dt) => 1 - Math.exp(-rate * dt) // framerate-independent smoothing factor
const coarse = window.matchMedia('(pointer: coarse)').matches
const query = new URLSearchParams(location.search)

const stage = document.getElementById('stage')
const canvas = document.getElementById('scene')
const hud = document.getElementById('hud')
const seedInput = document.getElementById('seed-input')
const layoutOut = document.getElementById('layout-out')
const stressFill = document.getElementById('stress-fill')
const camHint = document.getElementById('cam-hint')

// ---- sim (same construction as the 2D page's §4) ---------------------------
const pinnedSeed = parseInt(query.get('seed'), 10)
if (Number.isFinite(pinnedSeed) && pinnedSeed >= 0) params.seed = pinnedSeed >>> 0
else if (params.randomSeedOnLoad) params.seed = Math.floor(Math.random() * 1e6)

// ---- shared materials / geometry -------------------------------------------
// procedural grass: a speckled tile, repeated. 1 tile = TILE world units.
const TILE = 128
function makeGroundTexture(base, [r0, r1], [g0, g1], [b0, b1]) {
  const c = document.createElement('canvas'); c.width = c.height = 256
  const x = c.getContext('2d'), rnd = makePRNG(20260824)
  x.fillStyle = base; x.fillRect(0, 0, 256, 256)
  for (let i = 0; i < 5200; i++) {
    const r = r0 + Math.floor(rnd() * (r1 - r0)), g = g0 + Math.floor(rnd() * (g1 - g0)), b = b0 + Math.floor(rnd() * (b1 - b0))
    x.fillStyle = `rgba(${r},${g},${b},${0.25 + rnd() * 0.35})`
    x.fillRect(rnd() * 256, rnd() * 256, 1 + rnd() * 2, 2 + rnd() * 4)
  }
  const t = new THREE.CanvasTexture(c)
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.colorSpace = THREE.SRGBColorSpace
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy())
  return t
}
const grassTex = makeGroundTexture('#6aa64a', [70, 135], [135, 205], [45, 85])
const strawTex = makeGroundTexture('#b39a5c', [140, 205], [118, 172], [60, 110]) // trodden paddock floor
const lam = (color, extra) => new THREE.MeshLambertMaterial({ color, flatShading: true, ...extra })
const MAT = {
  ground:  new THREE.MeshLambertMaterial({ map: grassTex, color: 0xc9dcb4 }),                       // rough grass outside the fence
  pasture: new THREE.MeshLambertMaterial({ map: grassTex, color: 0xffffff }),
  pen:     new THREE.MeshLambertMaterial({ map: strawTex, color: 0xffffff }),
  post:    lam(0x7d6341),
  rail:    lam(0xa0865a),
  gatePost: lam(0xd8c487),
  flag:    new THREE.MeshLambertMaterial({ color: 0xd9412f, side: THREE.DoubleSide }),
  trunk:   lam(0x6b5236),
  crown:   lam(0xffffff),
  hill:    lam(0x6c9a5c),
  cloud:   new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, emissive: 0x9aa7b3 }),
  vcol:    new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }),
}
const decal = (color, opacity, order) => {
  const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide })
  m.userData.order = order
  return m
}
const unitBox = new THREE.BoxGeometry(1, 1, 1)
const unitDisc = new THREE.CircleGeometry(1, 64).rotateX(-Math.PI / 2)   // flat on the ground, radius 1
const TRS = (x, y, z, sx = 1, sy = sx, sz = sx, rx = 0, ry = 0, rz = 0) =>
  new M4().compose(new V3(x, y, z), new Quat().setFromEuler(new THREE.Euler(rx, ry, rz)), new V3(sx, sy, sz))
// one coloured, placed piece of a merged model (non-indexed so everything merges)
function part(geo, color, m) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone()
  if (m) g.applyMatrix4(m)
  const c = new THREE.Color(color), n = g.attributes.position.count, a = new Float32Array(n * 3)
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3))
  return g
}
// a ground-hugging plane with world-scaled UVs (so every surface shares one grass tile size)
function groundPlane(w, h, mat, y) {
  const g = new THREE.PlaneGeometry(w, h).rotateX(-Math.PI / 2)
  const uv = g.attributes.uv
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / TILE, uv.getY(i) * h / TILE)
  const m = new THREE.Mesh(g, mat)
  m.position.y = y
  m.receiveShadow = true
  return m
}

// ---- static world: endless ground, far hills, clouds -----------------------
{
  const R = 12000, g = new THREE.CircleGeometry(R, 48).rotateX(-Math.PI / 2), uv = g.attributes.uv
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 2 * R / TILE, uv.getY(i) * 2 * R / TILE)
  const ground = new THREE.Mesh(g, MAT.ground)
  ground.receiveShadow = true
  scene.add(ground)

  const rnd = makePRNG(7), ico = new THREE.IcosahedronGeometry(1, 1)
  const hills = new THREE.InstancedMesh(ico, MAT.hill, 18)
  const m = new M4()
  for (let i = 0; i < 18; i++) {
    const a = (i + rnd() * 0.6) / 18 * Math.PI * 2, d = 3600 + rnd() * 1800, s = 900 + rnd() * 900
    m.compose(new V3(560 + Math.cos(a) * d, -40, 360 + Math.sin(a) * d), new Quat().setFromAxisAngle(AX_Y, rnd() * 6), new V3(s, 220 + rnd() * 320, s * (0.7 + rnd() * 0.5)))
    hills.setMatrixAt(i, m)
  }
  hills.frustumCulled = false
  scene.add(hills)

  // clouds sit beyond every camera's reach (orbit zoom is capped below them)
  const blobs = []
  for (let i = 0; i < 11; i++) {
    const a = rnd() * Math.PI * 2, d = 3200 + rnd() * 3600, y = 1500 + rnd() * 800, s = 220 + rnd() * 220
    const cx = 560 + Math.cos(a) * d, cz = 360 + Math.sin(a) * d
    for (let k = 0; k < 4; k++) blobs.push([cx + (k - 1.5) * s * 0.75, y + (rnd() - 0.5) * s * 0.2, cz + (rnd() - 0.5) * s * 0.5, s * (0.6 + rnd() * 0.5)])
  }
  const clouds = new THREE.InstancedMesh(ico, MAT.cloud, blobs.length)
  blobs.forEach(([x, y, z, s], i) => { m.compose(new V3(x, y, z), new Quat(), new V3(s, s * 0.45, s * 0.8)); clouds.setMatrixAt(i, m) })
  clouds.frustumCulled = false
  scene.add(clouds)
}

// ---- the course: pasture, fence, gate, paddock, trees (rebuilt per course) --
const FENCE_H = 10, POST_GAP = 30
const postGeo = new THREE.BoxGeometry(2.2, FENCE_H + 1, 2.2).translate(0, (FENCE_H + 1) / 2, 0)
const gatePostGeo = new THREE.BoxGeometry(3.2, 17, 3.2).translate(0, 8.5, 0)
const flagGeo = new THREE.PlaneGeometry(7, 4).translate(3.5, 0, 0)
const trunkGeo = new THREE.CylinderGeometry(2.2, 3.2, 22, 6).translate(0, 11, 0)
const crownGeo = new THREE.IcosahedronGeometry(1, 1)
const rockGeo = new THREE.DodecahedronGeometry(1, 0)
const course = { group: new THREE.Group(), disposables: [], sig: '', gate: null, slots: [], nextSlot: 0, paddock: null, flags: [], bounds: null, dims: '' }
scene.add(course.group)

function rebuildCourse() {
  for (const o of course.disposables) o.dispose()
  course.disposables.length = 0
  course.group.clear()
  course.flags.length = 0
  const p = params, g = sim.gate, half = p.gateWidth / 2, r = sim.playRect()
  const cx = p.canvasW / 2, cz = p.canvasH / 2
  const add = (o) => { course.group.add(o); return o }
  const own = (geo) => { course.disposables.push(geo); return geo }
  const m = new M4(), q = new Quat()
  // gate frame → world: u runs along the wall (tx,ty), v points out of the pasture (nx,ny)
  const gw = (u, v) => ({ x: g.x + g.tx * u + g.nx * v, y: g.y + g.ty * u + g.ny * v })

  // pasture floor
  const floor = groundPlane(r.x1 - r.x0, r.y1 - r.y0, MAT.pasture, 0.2)
  own(floor.geometry); floor.position.x = cx; floor.position.z = cz
  add(floor)

  // paddock (the pen): sized to the herd, slots filled far-end first
  const N = sim.sheep.length, SP = 14
  const cols = Math.max(6, Math.ceil(Math.sqrt(N * 1.5))), rows = Math.max(1, Math.ceil(N / cols))
  const PW = Math.max(cols * SP + 14, p.gateWidth + 60), PD = 66 + rows * SP
  course.paddock = { PW, PD }
  const rnd = makePRNG((p.seed ^ 0x9e3779b9) >>> 0)
  course.slots = []
  for (let row = 0; row < rows; row++) {
    const line = []
    for (let c = 0; c < cols; c++) {
      const s = gw((c - (cols - 1) / 2) * SP + (rnd() - 0.5) * 5, PD - 10 - row * SP + (rnd() - 0.5) * 5)
      s.face = rnd() * Math.PI * 2
      line.push(s)
    }
    for (let i = line.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [line[i], line[j]] = [line[j], line[i]] }
    course.slots.push(...line)
  }
  course.nextSlot = 0
  const penMid = gw(0, PD / 2)
  const penFloor = groundPlane(PW, PD, MAT.pen, 0.3)
  own(penFloor.geometry)
  penFloor.position.x = penMid.x; penFloor.position.z = penMid.y
  penFloor.rotation.y = -Math.atan2(g.ty, g.tx)
  add(penFloor)
  // worn earth at the gate mouth — the thing to aim the flock at
  const mouth = new THREE.Mesh(unitDisc, decal(0x7a6242, 0.6))
  course.disposables.push(mouth.material)
  mouth.position.set(g.x, 0.45, g.y); mouth.scale.set(p.gateWidth * 0.8, 1, p.gateWidth * 0.8); mouth.renderOrder = 1
  add(mouth)

  // fence runs → posts + three rails each
  const posts = [], rails = []
  const run = (a, b) => {
    const len = Math.hypot(b.x - a.x, b.y - a.y)
    if (len < 1) return
    const n = Math.max(1, Math.round(len / POST_GAP))
    for (let i = 0; i <= n; i++) posts.push({ x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n })
    rails.push([a, b, len])
  }
  const sides = [
    [{ x: r.x0, y: r.y0 }, { x: r.x1, y: r.y0 }], // 0 N
    [{ x: r.x1, y: r.y0 }, { x: r.x1, y: r.y1 }], // 1 E
    [{ x: r.x1, y: r.y1 }, { x: r.x0, y: r.y1 }], // 2 S
    [{ x: r.x0, y: r.y1 }, { x: r.x0, y: r.y0 }], // 3 W
  ]
  const along = (pt) => (pt.x - g.x) * g.tx + (pt.y - g.y) * g.ty
  for (let side = 0; side < 4; side++) {
    const [a, b] = sides[side]
    if (side !== g.side) { run(a, b); continue }
    const lo = along(a) < along(b) ? a : b, hi = lo === a ? b : a
    run(lo, gw(-half, 0)); run(gw(half, 0), hi)          // the mouth stays open
    // paddock: two flanks + far end, plus a near-side stub where it overhangs a pasture corner
    run(gw(-PW / 2, 0), gw(-PW / 2, PD)); run(gw(-PW / 2, PD), gw(PW / 2, PD)); run(gw(PW / 2, PD), gw(PW / 2, 0))
    if (-PW / 2 < along(lo)) run(gw(-PW / 2, 0), lo)
    if (PW / 2 > along(hi)) run(hi, gw(PW / 2, 0))
  }
  const postMesh = add(new THREE.InstancedMesh(postGeo, MAT.post, posts.length))
  posts.forEach((pt, i) => { m.makeTranslation(pt.x, 0, pt.y); postMesh.setMatrixAt(i, m) })
  const railMesh = add(new THREE.InstancedMesh(unitBox, MAT.rail, rails.length * 3))
  rails.forEach(([a, b, len], i) => {
    q.setFromAxisAngle(AX_Y, -Math.atan2(b.y - a.y, b.x - a.x))
    for (let k = 0; k < 3; k++) {
      m.compose(new V3((a.x + b.x) / 2, 3 + k * 3, (a.y + b.y) / 2), q, new V3(len, 1.1, 0.7))
      railMesh.setMatrixAt(i * 3 + k, m)
    }
  })
  for (const im of [postMesh, railMesh]) { im.castShadow = im.receiveShadow = true; im.frustumCulled = false; course.disposables.push(im) }

  // gate posts (tall, pale, flagged) and the gate leaf swung back along the outside of the fence
  for (const u of [-half, half]) {
    const pt = gw(u, 0)
    const gp = add(new THREE.Mesh(gatePostGeo, MAT.gatePost))
    gp.position.set(pt.x, 0, pt.y); gp.castShadow = true
    const flag = add(new THREE.Mesh(flagGeo, MAT.flag))
    flag.position.set(pt.x, 19.5, pt.y); flag.userData.base = -Math.atan2(g.ty, g.tx) + (u < 0 ? Math.PI : 0)
    course.flags.push(flag)
  }
  {
    const leaf = add(new THREE.Group()), W = p.gateWidth - 3, hinge = gw(-half, 2.5)
    const ang = Math.atan2(-g.ty * 0.966 + g.ny * 0.259, -g.tx * 0.966 + g.nx * 0.259) // 15° off the fence line, outside
    leaf.position.set(hinge.x, 0, hinge.y); leaf.rotation.y = -ang
    const bar = (x, y, sx, sy, rz = 0) => {
      const b = new THREE.Mesh(unitBox, MAT.gatePost)
      b.position.set(x, y, 0); b.scale.set(sx, sy, 0.8); b.rotation.z = rz; b.castShadow = true
      leaf.add(b)
    }
    bar(W / 2, 2.4, W, 1); bar(W / 2, 6, W, 1); bar(W / 2, 9.6, W, 1)
    bar(0.6, 6, 1.2, 9); bar(W - 0.6, 6, 1.2, 9)
    bar(W / 2, 6, Math.hypot(W, 7.2), 0.9, Math.atan2(7.2, W))
  }

  // trees: seeded scatter outside the fence, thinning toward it so the view stays open
  const trees = [], trnd = makePRNG(4242)
  const inPaddock = (x, y) => { const u = along({ x, y }), v = (x - g.x) * g.nx + (y - g.y) * g.ny; return Math.abs(u) < PW / 2 + 45 && v > -10 && v < PD + 45 }
  for (let i = 0; i < 900 && trees.length < 150; i++) {
    const x = cx + (trnd() - 0.5) * (p.canvasW + 3200), y = cz + (trnd() - 0.5) * (p.canvasH + 3200)
    const size = 16 + trnd() * 16, tone = trnd(), keep = trnd()
    const dx = Math.max(r.x0 - x, 0, x - r.x1), dy = Math.max(r.y0 - y, 0, y - r.y1), d = Math.hypot(dx, dy)
    if (d < 110 || inPaddock(x, y)) continue
    if (keep > 0.08 + 0.92 * smoothstep(110, 700, d)) continue
    trees.push({ x, y, size, tone })
  }
  const trunks = add(new THREE.InstancedMesh(trunkGeo, MAT.trunk, trees.length))
  const crowns = add(new THREE.InstancedMesh(crownGeo, MAT.crown, trees.length))
  const col = new THREE.Color()
  trees.forEach((t, i) => {
    const k = t.size / 22
    m.compose(new V3(t.x, 0, t.y), q.identity(), new V3(k, k, k)); trunks.setMatrixAt(i, m)
    m.compose(new V3(t.x, 20 * k + t.size * 0.75, t.y), q.setFromAxisAngle(AX_Y, t.tone * 6), new V3(t.size, t.size * 1.2, t.size)); crowns.setMatrixAt(i, m)
    crowns.setColorAt(i, col.setHSL(0.27 + t.tone * 0.08, 0.42, 0.26 + t.tone * 0.1))
  })
  for (const im of [trunks, crowns]) { im.castShadow = true; im.frustumCulled = false; course.disposables.push(im) }

  // obstacles inside the pasture (owner 2026-11-14): the sim's solid discs, dressed
  // from obstacleItems() — a stand's trees, a rock's boulders (same seeds as the 2D page)
  {
    const stand = [], rocks = []
    for (const o of sim.obstacles) for (const it of obstacleItems(o)) (o.kind === 'rocks' ? rocks : stand).push(it)
    const oc = new THREE.Color()
    if (stand.length) {
      const oTrunks = add(new THREE.InstancedMesh(trunkGeo, MAT.trunk, stand.length))
      const oCrowns = add(new THREE.InstancedMesh(crownGeo, MAT.crown, stand.length))
      stand.forEach((t, i) => {
        const size = t.r * 1.15, k = (0.8 + t.tone * 0.5) * size / 14
        m.compose(new V3(t.x, 0, t.y), q.identity(), new V3(k * 0.7, k, k * 0.7)); oTrunks.setMatrixAt(i, m)
        m.compose(new V3(t.x, 18 * k + size * 0.7, t.y), q.setFromAxisAngle(AX_Y, t.tone * 6), new V3(size, size * 1.25, size)); oCrowns.setMatrixAt(i, m)
        oCrowns.setColorAt(i, oc.setHSL(0.27 + t.tone * 0.08, 0.45, 0.24 + t.tone * 0.1))
      })
      for (const im of [oTrunks, oCrowns]) { im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false; course.disposables.push(im) }
    }
    if (rocks.length) {
      const oRocks = add(new THREE.InstancedMesh(rockGeo, MAT.crown, rocks.length))
      rocks.forEach((t, i) => {
        const h = t.r * (0.55 + t.tone * 0.35)
        m.compose(new V3(t.x, h * 0.35, t.y), q.setFromEuler(new THREE.Euler(t.tone * 0.5 - 0.25, t.tone * 6, 0.2 - t.tone * 0.4)), new V3(t.r, h, t.r)); oRocks.setMatrixAt(i, m)
        oRocks.setColorAt(i, oc.setHSL(0.09, 0.06, 0.42 + t.tone * 0.16))
      })
      oRocks.castShadow = true; oRocks.receiveShadow = true; oRocks.frustumCulled = false; course.disposables.push(oRocks)
    }
  }

  // drive gates (POC-v14 FO1–FO3): two hurdle panels per gate, a post at each end;
  // a gate the whole working flock has been through turns green
  if (sim.driveGates.length) {
    const hurdleMat = MAT.hurdle || (MAT.hurdle = lam(0xffffff)) // white: the per-instance colour is the paint
    const panels = []
    const nextGate = sim.nextGate() // competition course: the gate the flock must take next (null on a pasture)
    for (const d of sim.driveGates) { const st = d.done ? 1 : d === nextGate ? 2 : 0; panels.push([d.a0, d.e0, st], [d.a1, d.e1, st]) }
    const bars = add(new THREE.InstancedMesh(unitBox, hurdleMat, panels.length * 3))
    const ends = add(new THREE.InstancedMesh(unitBox, hurdleMat, panels.length * 2))
    const dc = new THREE.Color()
    panels.forEach(([a, b, done], i) => {
      const len = Math.hypot(b.x - a.x, b.y - a.y)
      q.setFromAxisAngle(AX_Y, -Math.atan2(b.y - a.y, b.x - a.x))
      for (let k = 0; k < 3; k++) {
        m.compose(new V3((a.x + b.x) / 2, 3.5 + k * 4, (a.y + b.y) / 2), q, new V3(len, 1.5, 1.2))
        bars.setMatrixAt(i * 3 + k, m); bars.setColorAt(i * 3 + k, dc.set(done === 1 ? 0x6fcf8c : done === 2 ? 0xffc93c : 0xd9b877))
      }
      ;[a, b].forEach((pt, k) => {
        m.compose(new V3(pt.x, k ? 7 : 9.5, pt.y), q, new V3(2.4, k ? 14 : 19, 2.4))  // the gap post (a) stands taller
        ends.setMatrixAt(i * 2 + k, m); ends.setColorAt(i * 2 + k, dc.set(done === 1 ? 0xeafaef : done === 2 ? (k ? 0xc98a1e : 0xfff1b8) : k ? 0x8a6f48 : 0xf6ecd2))
      })
    })
    for (const im of [bars, ends]) { im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false; course.disposables.push(im) }
  }

  // competition course (owner 2026-11-18): the required path dashed on the grass, a number over
  // every gate (amber = the one to take next, green = cleared), and a bar across the pen while it is shut
  if (sim.compPath) {
    const path = sim.idealPath, dash = 14, gap = 12
    const segs = []
    for (let i = 0; i + 2 < path.length; i++) { // …up to the pen mouth
      const a = path[i], b = path[i + 1], len = Math.hypot(b.x - a.x, b.y - a.y), ang = Math.atan2(b.y - a.y, b.x - a.x)
      for (let u = dash; u + dash < len; u += dash + gap) segs.push([a.x + (b.x - a.x) * (u + dash / 2) / len, a.y + (b.y - a.y) * (u + dash / 2) / len, ang])
    }
    const pathMat = decal(0xf4efdc, 0.5); course.disposables.push(pathMat)
    const dashes = add(new THREE.InstancedMesh(unitBox, pathMat, segs.length))
    segs.forEach(([x, y, ang], i) => { q.setFromAxisAngle(AX_Y, -ang); m.compose(new V3(x, 0.5, y), q, new V3(dash, 0.3, 2.2)); dashes.setMatrixAt(i, m) })
    dashes.frustumCulled = false; dashes.renderOrder = 1; course.disposables.push(dashes)
    const nextGate = sim.nextGate()
    for (const d of sim.driveGates) {
      const c = document.createElement('canvas'); c.width = c.height = 128
      const x = c.getContext('2d')
      x.beginPath(); x.arc(64, 64, 56, 0, Math.PI * 2)
      x.fillStyle = d.done ? '#2f8f55' : d === nextGate ? '#ffc93c' : 'rgba(20, 26, 31, 0.82)'; x.fill()
      x.lineWidth = 8; x.strokeStyle = d.done ? '#eafaef' : d === nextGate ? '#5a3d00' : '#d9b877'; x.stroke()

    for (let i = 0; i < n; i++) {
      if (i) acc += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y)
      pos.setXYZ(i, pts[i].x, y, pts[i].y); dist.setX(i, acc)
    }
    pos.needsUpdate = dist.needsUpdate = true
    geo.setDrawRange(0, n)
  }
  overlays.add(line)
  return line
}
const outlineLine = dashLine(1024, 0xe8eef3, 0.8, 3, 6)
const pathLine = dashLine(8, 0x6eaa78, 0.7, 7, 8)
const C_OUTLINE = new THREE.Color(0xe8eef3), C_TRACK = new THREE.Color(0xf0a24f)

// the herd perimeter line: hull ⊕ disc(margin), rounded corners — same construction as the 2D drawFlockOutline
function outlinePoints(hull, m) {
  const out = []
  if (hull.length === 1) {
    for (let k = 0; k <= 32; k++) out.push({ x: hull[0].x + m * Math.cos(k / 32 * Math.PI * 2), y: hull[0].y + m * Math.sin(k / 32 * Math.PI * 2) })
    return out
  }
  const n = hull.length, normalAngle = (a, b) => Math.atan2(-(b.x - a.x), b.y - a.y)
  for (let i = 0; i < n; i++) {
    const prev = hull[(i - 1 + n) % n], v = hull[i], next = hull[(i + 1) % n]
    let a0 = normalAngle(prev, v), a1 = normalAngle(v, next)
    if (a1 < a0) a1 += Math.PI * 2
    const steps = Math.max(1, Math.ceil((a1 - a0) / 0.22))
    for (let k = 0; k <= steps; k++) { const a = a0 + (a1 - a0) * k / steps; out.push({ x: v.x + m * Math.cos(a), y: v.y + m * Math.sin(a) }) }
  }
  out.push(out[0])
  return out
}

function updateOverlays() {
  overlays.visible = overlaysOn
  if (!overlaysOn) return
  const p = params, d = sim.dog, g = sim.gate, dbg = p.debug

  // the eye — per command, exactly the 2D drawEye numbers
  eyeDisc.visible = eyeWedge.visible = dbg.eye
  if (dbg.eye) {
    const easy = d.command === 'easy', lying = d.command === 'lie_down'
    const Rc = lying ? p.R_flee * (1 + p.lieConeExt)
             : d.command === 'walk_on' ? p.R_flee * (1 + p.driveConeExt)
             : easy ? p.R_flee * (1 + p.easyConeExt)
             : p.R_flee
    const Ra = lying ? p.R_flee * p.postureRange : p.R_flee
    const half = easy ? p.easyConeDeg / 2 * Math.PI / 180
               : lying ? p.lieConeDeg / 2 * Math.PI / 180
               : Math.acos(Math.pow(0.5, 1 / Math.max(p.coneK, 0.01)))
    const mid = d.facing + (d.lieSide || 0) * p.downConeOffsetDeg * Math.PI / 180
    eyeDisc.position.set(d.pos.x, 0.62, d.pos.y); eyeDisc.scale.set(Ra, 1, Ra)
    eyeDisc.material.opacity = 0.06 + 0.16 * p.ambient
    const key = Math.round(half * 500)
    if (key !== eyeWedge.userData.key) {
      eyeWedge.geometry.dispose()
      eyeWedge.geometry = new THREE.CircleGeometry(1, 40, -half, 2 * half).rotateX(-Math.PI / 2)
      eyeWedge.userData.key = key
    }
    eyeWedge.position.set(d.pos.x, 0.7, d.pos.y); eyeWedge.scale.set(Rc, 1, Rc); eyeWedge.rotation.y = -mid
  }

  // herd perimeter line; orange while it is the dog's flank track
  const flanking = d.command === 'come_by' || d.command === 'away'
  outlineLine.visible = dbg.flockOutline && sim.hull.length > 0
  if (outlineLine.visible) {
    outlineLine.setPoints(outlinePoints(sim.hull, p.perimeterMargin), 0.9)
    outlineLine.material.color.copy(flanking && dbg.dogTrack ? C_TRACK : C_OUTLINE)
  }

  // ideal path, shaded by the flock's current deviation
  const path = sim.idealPath
  pathLine.visible = !!path
  if (path) {
    const dev = Math.min(1, sim.distToPath(sim.gcm) / p.lineNorm)
    pathLine.setPoints(path, 0.8)
    pathLine.material.color.setRGB((110 + 130 * dev) / 255, (170 - 110 * dev) / 255, 120 / 255, THREE.SRGBColorSpace)
  }

  // gate draw area + crush heat + goal
  attractOuter.visible = attractInner.visible = dbg.gateAttract && p.gateAttractR > 0
  attractOuter.position.set(g.x, 0.5, g.y); attractOuter.scale.set(p.gateAttractR, 1, p.gateAttractR)
  attractInner.position.set(g.x, 0.54, g.y); attractInner.scale.set(p.gateAttractR / 2, 1, p.gateAttractR / 2)
  // POC-v13 G5: the cone the draw has grown toward a trotting line's leaders
  const gc = sim.gateCone
  attractCone.visible = attractOuter.visible && !!gc && gc.len > 0
  if (attractCone.visible) {
    const chalf = p.gateConeDeg / 2 * Math.PI / 180, ckey = Math.round(chalf * 500), cR = p.gateAttractR + gc.len
    if (ckey !== attractCone.userData.key) {
      attractCone.geometry.dispose()
      attractCone.geometry = new THREE.CircleGeometry(1, 40, -chalf, 2 * chalf).rotateX(-Math.PI / 2)
      attractCone.userData.key = ckey
    }
    attractCone.position.set(g.x, 0.52, g.y); attractCone.scale.set(cR, 1, cR); attractCone.rotation.y = -gc.ang
  }
  const t = p.crushThreshold > 0 ? sim.crush / p.crushThreshold : 0
  crushDisc.visible = t >= 0.05
  if (crushDisc.visible) {
    crushDisc.position.set(g.x, 0.58, g.y); crushDisc.scale.set(p.crushRadius, 1, p.crushRadius)
    crushDisc.material.color.setRGB(1, 180 * (1 - Math.min(t, 1)) / 255, 40 / 255, THREE.SRGBColorSpace)
    crushDisc.material.opacity = Math.min(0.75, 0.15 + 0.4 * Math.min(t, 1.3))
  }
  goalRing.position.set(p.goal.x, 0.66, p.goal.y); goalDot.position.set(p.goal.x, 0.66, p.goal.y)
}

// ---- cameras -----------------------------------------------------------------
//   orbit   free camera around the pasture (drag / right-drag / wheel)
//   top     straight down, north up — the 2D page's view
//   handler over the handler's shoulder: the view a trial is actually run from
//   dog     behind the dog, down his eye
const CAMS = ['orbit', 'top', 'handler', 'dog']
const CAM_HINTS = {
  orbit: 'drag to orbit · right-drag to pan · wheel to zoom · 1 again to re-centre',
  top: 'straight down — north up, same as the 2D page',
  handler: 'from the handler’s post by the gate',
  dog: 'behind the dog, down his eye',
}
const controls = new OrbitControls(camera, canvas)
controls.enableDamping = true
controls.dampingFactor = 0.12
controls.maxPolarAngle = Math.PI / 2 - 0.04
controls.minDistance = 50
controls.maxDistance = 1500
const camState = { mode: 'orbit', look: new V3(), snap: true }
const camButtons = Array.from(document.querySelectorAll('#cam-bar button[data-cam]'))
function fieldCentre() { return new V3(params.canvasW / 2, 0, params.canvasH / 2) }
function homeOrbit() { // a raised view from the south: north at the top, east on the right — reads like the 2D canvas
  // default zoom (owner 2026-11-18, measured off a phone-landscape screenshot): 29° down, the near fence filling ~94 % of the
  // view width, aimed a touch south of centre. Distance = whichever is farther of the height framing and the width fit.
  const c = fieldCentre(), pitch = 29 * Math.PI / 180, tanH = Math.tan(camera.fov / 2 * Math.PI / 180)
  const dH = params.canvasH * 1.147
  const dW = params.canvasW * 0.45 / (tanH * Math.max(camera.aspect, 0.5) * 0.94) + params.canvasH * 0.38 * Math.cos(pitch)
  const d = Math.max(dH, dW)
  controls.target.set(c.x, 0, c.z + params.canvasH * 0.04)
  camera.position.set(c.x, d * Math.sin(pitch), controls.target.z + d * Math.cos(pitch))
}
function setCam(mode) {
  if (!CAMS.includes(mode)) return
  // orbit always lands on the starting view (owner 2026-11-18): coming back from top / handler / dog the camera was still
  // sitting where that mode left it — straight overhead after `top` — and it took a second click to re-centre
  if (mode === 'orbit') homeOrbit()
  camState.mode = mode
  camState.snap = true
  controls.enabled = mode === 'orbit'
  camera.up.set(0, 1, 0)
  if (mode === 'orbit') controls.update()
  for (const b of camButtons) b.classList.toggle('active', b.dataset.cam === mode)
  camHint.textContent = CAM_HINTS[mode]
}
const camWant = { pos: new V3(), look: new V3() }
function updateCamera(dt) {
  const mode = camState.mode
  if (mode === 'orbit') { controls.update(); return }
  const { pos, look } = camWant
  if (mode === 'top') {
    const bb = course.bounds, tanH = Math.tan(camera.fov / 2 * Math.PI / 180)
    const h = Math.max((bb.y1 - bb.y0) / 2 / tanH, (bb.x1 - bb.x0) / 2 / (tanH * camera.aspect)) * 1.1 // margin clears the camera bar
    camera.up.set(0, 0, -1)
    camera.position.set((bb.x0 + bb.x1) / 2, h, (bb.y0 + bb.y1) / 2)
    camera.lookAt((bb.x0 + bb.x1) / 2, 0, (bb.y0 + bb.y1) / 2)
    return
  }
  if (mode === 'handler') {
    const h = handlerPos(), g = sim.gcm, dx = g.x - h.x, dy = g.y - h.y, d = Math.hypot(dx, dy) || 1
    pos.set(h.x - dx / d * 66, 40, h.y - dy / d * 66)
    look.set(h.x + dx * 0.6, 2, h.y + dy * 0.6)
  } else { // dog
    const d = sim.dog, fx = Math.cos(d.facing), fy = Math.sin(d.facing)
    pos.set(d.pos.x - fx * 78, 38, d.pos.y - fy * 78)
    look.set(d.pos.x + fx * 55, 4, d.pos.y + fy * 55)
  }
  const k = camState.snap ? 1 : ease(mode === 'dog' ? 3.5 : 2.5, dt)
  camera.position.lerp(pos, k)
  camState.look.lerp(look, k)
  camera.lookAt(camState.look)
  camState.snap = false
}

function resize() {
  const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight)
  renderer.setSize(w, h, false)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
}
new ResizeObserver(resize).observe(stage)
resize()
homeOrbit()

// ---- score card + HUD (same read-outs as the 2D page) --------------------------
// POC-v14: the score badge, the pops and the count-up tally card live in
// lib/sheep-score-ui.js (one copy for all three pages) — see ScoreUI.init in §4.
function hideCard() { ScoreUI.hide() }

function updateHud(fps) {
  const sc = sim.score(), d = sim.dog
  hud.textContent =
    `fps ${fps.toFixed(0)}  cmd ${d.command}${d.flankEasy ? '·easy' : ''}${d.lieSide ? (d.lieSide < 0 ? '·left' : '·right') : ''}${d.impulse ? ' ⚡' + d.impulse.name : ''}\n` +
    `intensity ${d.intensity.toFixed(2)}${d.impulseFactor > 1 ? ' ×' + d.impulseFactor.toFixed(2) : ''}  crush ${sim.crush.toFixed(1)}/${params.crushThreshold.toFixed(1)}\n` +
    `trot ${sim.sheep.reduce((n, s) => n + (s.trot ? 1 : 0), 0)}  injuries ${sim.injuries}  penned ${sc.penned}/${sim.sheep.length}\n` +
    ScoreUI.hud(sim)
  if (document.activeElement !== seedInput && seedInput.value !== String(params.seed)) seedInput.value = params.seed
  if (document.activeElement !== herdInput && herdInput.value !== String(params.sheepCount)) { herdInput.value = params.sheepCount; herdOut.textContent = params.sheepCount }
  if (layoutOut.textContent !== sim.layout) layoutOut.textContent = sim.layout
  syncObstacleSlider()
  let sum = 0
  for (const s of sim.sheep) sum += s.stress
  const mean = sim.sheep.length ? sum / sim.sheep.length : 0
  stressFill.style.width = (Math.min(1, mean * 2) * 100).toFixed(1) + '%'
  stressFill.style.background = `rgb(${Math.round(110 + 145 * mean)},${Math.round(200 - 170 * mean)},80)`
  ScoreUI.frame(sim) // badge, pops, and the tally card when the run ends
  DemoUI.frame(sim)  // demo mode: what the auto-handler is doing, and a pulse on the pad when the command changes
}

function render3D(dt, time, fps) {
  if (sim.gate !== course.gate || courseSig() !== course.sig) rebuildCourse()
  updateSheep(dt, time)
  updateDog(dt, time)
  updateBulls(dt, time) // POC-v17
  updateHandler(dt)
  updateOverlays()
  for (const f of course.flags) f.rotation.y = f.userData.base + Math.sin(time * 2.2 + f.position.x) * 0.25
  updateCamera(dt || 1 / 60)
  updateHud(fps)
  renderer.render(scene, camera)
}

// ============================================================================
// §3 INPUT — same commands, keys and buttons as the 2D page. [throwaway]
//   Extra here: camera keys (C cycles, 1–4 pick) and O for the overlays.
// ============================================================================
const cmdButtons = Array.from(document.querySelectorAll('#controls button[data-cmd]'))
const VARIANTS = {
  come_by_easy:   ['come_by',  { easy: true }],
  away_easy:      ['away',     { easy: true }],
  lie_down_left:  ['lie_down', { side: -1 }],
  lie_down_right: ['lie_down', { side: 1 }],
}
function displayCommand(d) {
  if (d.flankEasy && (d.command === 'come_by' || d.command === 'away')) return d.command === 'come_by' ? 'come_by_easy' : 'away_easy'
  if (d.command === 'lie_down' && d.lieSide) return d.lieSide < 0 ? 'lie_down_left' : 'lie_down_right'
  return d.command
}
function updateStrip() {
  const cmd = displayCommand(sim.dog)
  for (const b of cmdButtons) b.classList.toggle('active', b.dataset.cmd === cmd)
}
function issue(cmd, flavor) {
  const [verb, vopts] = VARIANTS[cmd] || [cmd, {}]
  sim.setCommand(verb, flavor ? { ...vopts, impulse: flavor } : vopts)
  updateStrip()
}
const flavorOf = (ev) => (ev.shiftKey ? 'bark' : ev.altKey ? 'lean' : undefined)
function restartRun() { sim.reseed(params.seed); hideCard(); issue('that_ll_do') }
for (const b of cmdButtons) b.addEventListener('click', (ev) => issue(b.dataset.cmd, flavorOf(ev)))
document.querySelector('[data-action="reset"]').addEventListener('click', restartRun)
function syncControllers(key) {
  for (const g of guis.roots) for (const c of g.controllersRecursive()) if (c._setting && c._setting.key === key) c.updateDisplay()
}
function setSeed(seed) {
  params.seed = seed >>> 0
  HOOKS.respawn(); hideCard(); issue('that_ll_do')
  syncControllers('seed')
}
function newCourse() { setSeed(Math.floor(Math.random() * 1e6)) }
seedInput.addEventListener('change', () => {
  const v = parseInt(seedInput.value, 10)
  if (Number.isFinite(v) && v >= 0 && (v >>> 0) !== params.seed) setSeed(v)
  else seedInput.value = params.seed
})
seedInput.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === 'Escape') seedInput.blur() })
document.getElementById('reseed-btn').addEventListener('click', newCourse)
// capture (owner 2026-11-18): the 2D page's state snapshot, here too — JSON to the clipboard + console
function captureState() {
  const r1 = v => Math.round(v * 10) / 10
  const out = { camera: { mode: camState.mode, pos: camera.position.toArray().map(r1), target: controls.target.toArray().map(r1), dist: r1(camera.position.distanceTo(controls.target)), aspect: Math.round(camera.aspect * 1000) / 1000, fov: camera.fov }, ...sim.captureState() } // camera first: the view the capture was taken from
  const text = JSON.stringify(out)
  console.log('[sheep-poc] state capture:\n' + text)
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {})
  const btn = document.getElementById('capture-btn')
  btn.textContent = 'copied ✓'
  setTimeout(() => { btn.textContent = 'capture' }, 900)
  return out
}
document.getElementById('capture-btn').addEventListener('click', captureState)
function togglePanels() { document.body.classList.toggle('panels-hidden') }
document.getElementById('panels-btn').addEventListener('click', togglePanels)
const drawerBtn = document.getElementById('drawer-btn')
function toggleDrawer() {
  const closed = document.body.classList.toggle('drawer-closed')
  drawerBtn.textContent = closed ? 'settings' : 'close'
  drawerBtn.blur()
}
drawerBtn.addEventListener('click', toggleDrawer)

// Full-screen is forced on touch devices: browsers only grant it from a user
// gesture, so every tap made while windowed asks again (the first tap gets it).
if (coarse && document.documentElement.requestFullscreen) {
  const goFull = () => {
    if (document.fullscreenElement) return
    document.documentElement.requestFullscreen({ navigationUI: 'hide' })
      .then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}) })
      .catch(() => {})
  }
  document.addEventListener('touchend', goFull, { passive: true })
  document.addEventListener('click', goFull)
}

const herdInput = document.getElementById('herd-size')
const herdOut = document.getElementById('herd-size-out')
{
  const s = SETTINGS.find((e) => e.key === 'sheepCount')
  herdInput.min = s.min; herdInput.max = s.max; herdInput.step = s.step
}
herdInput.value = params.sheepCount
herdOut.textContent = params.sheepCount
herdInput.addEventListener('input', () => { herdOut.textContent = herdInput.value })
herdInput.addEventListener('change', () => {
  params.sheepCount = parseInt(herdInput.value, 10)
  syncControllers('sheepCount')
  HOOKS.respawn()
})

let paused = false
const pauseBtn = document.getElementById('pause-btn')
function togglePause() {
  paused = !paused
  pauseBtn.textContent = paused ? 'resume' : 'pause'
  pauseBtn.classList.toggle('active', paused)
}
pauseBtn.addEventListener('click', togglePause)

for (const b of camButtons) b.addEventListener('click', () => { setCam(b.dataset.cam); b.blur() })
const overlayBtn = document.getElementById('overlay-btn')
function toggleOverlays() { overlaysOn = !overlaysOn; overlayBtn.classList.toggle('active', overlaysOn) }
overlayBtn.classList.add('active')
overlayBtn.addEventListener('click', () => { toggleOverlays(); overlayBtn.blur() })

const HOTKEYS = {
  ArrowLeft:  { plain: 'come_by', shift: 'come_by_easy', alt: 'lie_down_left' },
  ArrowUp:    { plain: 'walk_on', shift: 'easy', alt: ['walk_on', 'lean'], altShift: ['walk_on', 'bark'] },
  ArrowRight: { plain: 'away', shift: 'away_easy', alt: 'lie_down_right' },
  ArrowDown:  { plain: 'lie_down' },
  Enter:      { plain: 'that_ll_do' },
}
window.addEventListener('keydown', (ev) => {
  if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA')) return
  const k = ev.key.toLowerCase()
  if (!ev.metaKey && !ev.ctrlKey) {
    if (k === 'f') return sim.finishRun()
    if (k === 'r') return restartRun()
    if (k === 'h') return togglePanels()
    if (k === 'd') return toggleDrawer()
    if (k === 'p') return togglePause()
    if (k === 'o') return toggleOverlays()
    if (k === 'c') return setCam(CAMS[(CAMS.indexOf(camState.mode) + 1) % CAMS.length])
    if (k >= '1' && k <= '4' && !ev.altKey) return setCam(CAMS[+k - 1])
  }
  const m = HOTKEYS[ev.key]
  if (m) {
    ev.preventDefault()
    const pick = (ev.altKey && ev.shiftKey && m.altShift) || (ev.altKey && m.alt) || (ev.shiftKey && m.shift) || m.plain
    const [cmd, flavor] = Array.isArray(pick) ? pick : [pick]
    issue(cmd, flavor)
  }
})

// ============================================================================
// §4 BOOTSTRAP — the 2D page's fixed-timestep loop, rendering in 3D. [throwaway]
// ============================================================================
syncControllers('seed')
for (const g of guis.roots) g.close() // raw-param panels start folded; the stage is the point of this page
issue(sim.dog.command)
setCam(CAMS.includes(query.get('cam')) ? query.get('cam') : 'orbit')

// POC-v14: the score face. `project` maps a sim point to stage px through the live camera.
const popV = new V3()
ScoreUI.init({
  page: 'competition-3d', stage,
  project: (x, y) => {
    popV.set(x, 12, y).project(camera)
    return popV.z > 1 || popV.z < -1 ? null : { x: (popV.x * 0.5 + 0.5) * stage.clientWidth, y: (-popV.y * 0.5 + 0.5) * stage.clientHeight }
  },
  setSeed, newCourse, restart: restartRun,
})
PadUI.init(sim) // the live command's button filled green + every command given flashed under the secondary buttons (lib/sheep-pad-ui.js)
DemoUI.init({ stage }) // demo mode (A): lib/sheep-demo-ui.js

let last = performance.now() / 1000
let acc = 0, fps = 0, fpsAcc = 0, fpsFrames = 0, clock = 0

function frame(nowMs) {
  const now = nowMs / 1000
  let delta = now - last
  last = now
  if (delta > params.maxFrameDelta) delta = params.maxFrameDelta
  if (delta < 0) delta = 0

  if (paused) acc = 0
  else {
    acc += delta
    while (acc >= params.dt) {
      DemoUI.step(sim, params.dt) // demo mode: the auto-handler issues the dog's commands (lib/sheep-demo-ui.js)
      sim.step(params.dt)
      acc -= params.dt
    }
    clock += delta
  }

  fpsAcc += delta
  fpsFrames++
  if (fpsAcc >= 0.25) {
    fps = fpsFrames / fpsAcc
    fpsAcc = 0
    fpsFrames = 0
  }

  updateStrip()
  render3D(paused ? 0 : delta, clock, fps)
  requestAnimationFrame(frame)
}

// handles for the console (and for poking at the scene while tuning the look)
window.__sheep3d = { THREE, sim, scene, camera, renderer, controls, setCam, issue, render3D }
window.__sheep3dBooted = true
requestAnimationFrame(frame)
</script>

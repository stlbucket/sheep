<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14181c" />
    <!-- iPhone: Add to Home Screen opens the game as a standalone app (no toolbars) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Sheep" />
    <title>Sheep</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%91%3C/text%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./bundle/index-quxdZVjq.js"></script>
    <link rel="modulepreload" crossorigin href="./bundle/three-DlhMMrrZ.js">
    <link rel="stylesheet" crossorigin href="./bundle/index-CfwyNfiG.css">
  </head>
  <body class="drawer-closed">
    <div id="rotate-overlay">
      <div class="icon">📱</div>
      <div>rotate your phone —<br />the pasture plays in landscape</div>
    </div>
    <div id="app">
      <div id="stage">
        <canvas id="game"></canvas>
        <div id="center-stack">
          <div class="top">
            <button type="button" id="drawer-btn" title="open / close the settings drawer (seed, HUD, sliders) — D">settings</button>
            <button type="button" id="capture-btn" title="copy a JSON snapshot of the current game state (gate, perimeter markers, dog, sheep) to the clipboard + console">capture</button>
          </div>
          <div class="aux"><button type="button" id="reseed-btn" title="draw a new course">reseed</button></div>
          <div id="cam-bar">
            <button type="button" data-cam="orbit" title="free camera — drag to orbit, right-drag to pan, wheel to zoom; press again to return to the starting view — 1 (C cycles the cameras)">orbit</button>
            <button type="button" data-cam="top" title="straight down — matches the 2D page — 2 (C cycles the cameras)">top</button>
            <button type="button" data-cam="handler" title="over the handler's shoulder, by the gate — 3 (C cycles the cameras)">handler</button>
            <button type="button" data-cam="dog" title="behind the dog, looking down his eye — 4 (C cycles the cameras)">dog</button>
            <button type="button" id="overlay-btn" title="show / hide the ground overlays (eye, outline, path, gate draw) — O">overlays</button>
          </div>
        </div>
        <div id="stress">flock stress<div class="bar"><div class="fill" id="stress-fill"></div></div></div>
        <div id="cam-hint"></div>
        <div id="card"></div>
        <div id="boot-error"></div>
      </div>
      <div id="side">
        <section id="side-debug">
          <div class="row">
            <label for="seed-input">seed</label>
            <input id="seed-input" type="number" min="0" step="1" inputmode="numeric" />
          </div>
          <div class="row">
            <button type="button" id="reset-btn" title="restart the run on the same course">reset <kbd>R</kbd></button>
            <button type="button" id="home-link" title="back to the start menu">⌂ modes</button>
          </div>
          <div class="row"><span>layout:</span> <span class="layout" id="layout-out">—</span></div>
          <div id="hud">boot…</div>
        </section>
        <section id="side-dog">
          <div id="controls">
            <div class="pad">
              <button type="button" data-cmd="come_by">come <span class="w2">by</span> <kbd>←</kbd></button>
              <button type="button" data-cmd="walk_on">walk <span class="w2">on</span> <kbd>↑</kbd></button>
              <button type="button" data-cmd="away">away <kbd>→</kbd></button>
              <button type="button" data-cmd="come_by_easy">come <span class="w2">easy</span> <kbd>⇧←</kbd></button>
              <button type="button" data-cmd="easy">easy <kbd>⇧↑</kbd></button>
              <button type="button" data-cmd="away_easy">away <span class="w2">easy</span> <kbd>⇧→</kbd></button>
              <button type="button" data-cmd="lie_down_left">left <span class="w2">down</span> <kbd>⌥←</kbd></button>
              <button type="button" data-cmd="lie_down">lie <span class="w2">down</span> <kbd>↓</kbd></button>
              <button type="button" data-cmd="lie_down_right">right <span class="w2">down</span> <kbd>⌥→</kbd></button>
              <button type="button" data-cmd="bark" title="bark — a startle burst: every sheep in a wide ring round the dog jumps, eye or not; unsticks a standing ram, but stresses them all — W">bark <kbd>W</kbd></button>
              <button type="button" data-cmd="shove" title="shove — for about 2 s the dog walks straight in on the sheep in front, then goes back to his command; forces a stuck group, high stress — S">shove <kbd>S</kbd></button>
              <button type="button" data-cmd="lean" title="lean — the dog holds his spot and leans in with a longer, stronger eye; the sheep in front ease away slowly (the calm walk on) — L">lean <kbd>L</kbd></button>
            </div>
            <button type="button" data-cmd="that_ll_do">that'll <span class="w2">do</span> <kbd>⏎</kbd></button>
            <button type="button" id="battle-btn" data-cmd="battle_stations" hidden title="the dog runs to the nearest fence gun that bears on a wolf, rears up and shoots — ⌘⇧B, Ctrl⇧B or plain B">battle stations <kbd>B</kbd></button>
            <button type="button" id="nip-btn" title="heel nip — the dog dives at the heels of the sheep standing him off and it runs from him; only shown while that can happen — N">heel <span class="w2">nip</span> <kbd>N</kbd></button>
            <button type="button" id="pause-btn" title="freeze the sim — the camera stays live — P">pause</button>
            <div class="herd">
              <label for="herd-size">herd</label>
              <input id="herd-size" type="range" />
              <span id="herd-size-out">—</span>
            </div>
            <div class="obst" title="how many obstacle groups (tree stands / rocks) a course gets. Courses are random until you move this — then every course gets exactly this many. Release to re-lay the course">
              <label for="obst-freq">obstacles</label>
              <input id="obst-freq" type="range" />
              <span id="obst-freq-out">—</span>
            </div>
          </div>
        </section>
        <section id="side-assault" hidden>
          <div id="assault-status">—</div>
        </section>
      </div>
    </div>
    <div id="start-menu" hidden>
      <header>
        <h1>🐑 Sheep</h1>
        <p>Work the dog, gather the flock, pen it through the gate. Pick a mode.</p>
      </header>
      <main class="versions"></main>
      <footer>same controls everywhere — <kbd>←</kbd> come by · <kbd>↑</kbd> walk on · <kbd>→</kbd> away · <kbd>↓</kbd> lie down · <kbd>⏎</kbd> that'll do · <kbd>W</kbd> bark · <kbd>S</kbd> shove · <kbd>L</kbd> lean · <kbd>A</kbd> demo</footer>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14181c" />
    <!-- Installable (Android: Install app; iPhone: Add to Home Screen): opens full screen, no browser toolbars -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ODHD" />
    <title>ODHD</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%91%3C/text%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./bundle/index-29W004Nf.js"></script>
    <link rel="modulepreload" crossorigin href="./bundle/three-C1IcyzPO.js">
    <link rel="stylesheet" crossorigin href="./bundle/index-CGyxdteu.css">
  </head>
  <body class="drawer-closed">
    <div id="app">
      <div id="stage">
        <div id="face-off" hidden aria-live="off"></div>
        <canvas id="game"></canvas>
        <div id="cam-group" class="cams">
          <button type="button" data-cam="orbit" title="free camera — drag to orbit, right-drag to pan, wheel to zoom; press again to return to the starting view — 1 (C switches between orbit and top)">orbit</button>
          <button type="button" data-cam="top" title="straight down — matches the 2D page — 2 (C switches between orbit and top)">top</button>
        </div>
        <div id="center-stack">
          <div class="top">
            <button type="button" id="drawer-btn" title="open / close the settings drawer (seed, HUD, sliders) — D">settings</button>
            <button type="button" id="capture-btn" title="copy a JSON snapshot of the current game state (gate, perimeter markers, dog, sheep) to the clipboard + console">capture</button>
          </div>
          <div class="aux"><button type="button" id="reseed-btn" title="new game: draw a new course and start again" aria-label="new game"><span class="t">new</span><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.500h2V7h4.500v2H9v4.500H7V9H2.500V7H7z" /></svg></button></div>
          <div id="cam-bar"></div>
          <div class="sys">
            <button type="button" id="cam-toggle" title="switch between the top view and the orbit view" aria-label="switch camera"><svg class="i-top" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.800" d="M3 3h10v10H3z" /></svg><svg class="i-orbit" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round" d="M5 4.500h6l3 8H2z" /></svg></button>
            <button type="button" id="menu-btn" title="back to the start menu — pick a mode" aria-label="home"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 1.5 7.5h2V14h3.5v-4h2v4h3.5V7.5h2z" /></svg></button>
            <button type="button" id="overlay-btn" title="show / hide the ground overlays (eye, outline, path, gate draw) — O" aria-label="overlays"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 3.5C4.5 3.5 2 6.2 1 8c1 1.8 3.5 4.5 7 4.5s6-2.7 7-4.5c-1-1.800-3.500-4.500-7-4.500zm0 7.500a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0-1.600a1.400 1.400 0 1 0 0-2.800 1.400 1.400 0 0 0 0 2.800z" /></svg></button>
            <button type="button" id="pause-btn" title="freeze the sim — the camera stays live; while paused, click a sheep or the dog to see its attributes — P" aria-label="pause"><svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" /></svg><svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z" /></svg></button>
            <button type="button" id="sheep-btn" title="help: watch the demo, see the controls, who is on the field" aria-label="help"><svg viewBox="0 0 16 16" aria-hidden="true"><text x="8" y="13.500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800">?</text></svg></button>
            <button type="button" id="mute-btn" title="mute / unmute every sound — M" aria-label="mute"><svg class="i-on" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.500 6h2.500L8 2.500v11L4 10H1.500z" /><path fill="none" stroke="currentColor" stroke-width="1.400" stroke-linecap="round" d="M10.300 5.800a3.200 3.200 0 0 1 0 4.400M12.200 3.700a6 6 0 0 1 0 8.600" /></svg><svg class="i-off" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.500 6h2.500L8 2.500v11L4 10H1.500z" /><path fill="none" stroke="currentColor" stroke-width="1.500" stroke-linecap="round" d="M10.500 6l4 4M14.500 6l-4 4" /></svg></button>
            <button type="button" id="settings-btn" title="settings: sound volume" aria-label="settings"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.600" fill="none" stroke="currentColor" stroke-width="2.400" stroke-dasharray="2.199 2.199" /><circle cx="8" cy="8" r="3.500" fill="none" stroke="currentColor" stroke-width="2.200" /></svg></button>
            <button type="button" id="score-btn" title="show the scoring for the run you just finished" aria-label="scoring"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8v1.5h2.5V5a3 3 0 0 1-2.7 3 4 4 0 0 1-3.05 2.4V12H11v2H5v-2h2.25v-1.6A4 4 0 0 1 4.2 8 3 3 0 0 1 1.5 5V3.5H4zM4 5H3a1.5 1.5 0 0 0 1 1.4zm8 0v1.4A1.5 1.5 0 0 0 13 5z" /></svg></button>
          </div>
        </div>
        <div id="stress">flock stress<div class="bar"><div class="fill" id="stress-fill"></div></div></div>
        <div id="cam-hint"></div>
        <div id="card"></div>
        <div id="boot-error"></div>
      </div>
      <div id="side">
        <section id="side-debug">
          <div class="row">
            <label for="seed-input">seed</label>
            <input id="seed-input" type="number" min="0" step="1" inputmode="numeric" />
          </div>
          <div class="row">
            <button type="button" id="reset-btn" title="restart the run on the same course">reset <kbd>R</kbd></button>
            <button type="button" id="home-link" title="back to the start menu">⌂ modes</button>
          </div>
          <div class="row"><span>layout:</span> <span class="layout" id="layout-out">—</span></div>
          <div id="hud">boot…</div>
        </section>
        <section id="side-dog">
          <div id="controls">
            <div class="pad"></div>
            <button type="button" id="shed-btn" hidden aria-pressed="false" title="shedding — on: take these, take those and get in are offered beside the pad; off: none of them is (shepherd pad only)">shedding</button>
            <button type="button" data-cmd="that_ll_do">that'll <span class="w2">do</span> <kbd>⏎</kbd></button>
            <button type="button" id="battle-btn" data-cmd="battle_stations" hidden title="the dog runs to the nearest fence gun that bears on a wolf, rears up and shoots — ⌘⇧B, Ctrl⇧B or plain B">battle stations <kbd>B</kbd></button>
            <div class="herd">
              <label for="herd-size">herd</label>
              <input id="herd-size" type="range" />
              <span id="herd-size-out">—</span>
            </div>
            <div class="obst" title="how many obstacle groups (tree stands / rocks) a course gets. Courses are random until you move this — then every course gets exactly this many. Release to re-lay the course">
              <label for="obst-freq">obstacles</label>
              <input id="obst-freq" type="range" />
              <span id="obst-freq-out">—</span>
            </div>
          </div>
        </section>
        <section id="side-assault" hidden>
          <div id="assault-status">—</div>
        </section>
      </div>
      <button type="button" id="nip-btn" hidden title="heel nip — the ram's stand-off game: press it when the marker is in the green and the dog nips his heel; only shown while the bar is live — space">nip <kbd>space</kbd></button>
      <button type="button" id="take-this-btn" hidden title="take this — the dog goes straight in on the golden ewe, lamb, black sheep or yearling inside the gold ring round him (two thirds of his pressure radius) and meets her; only shown while one is in reach — space, or shift-space when it is the left-hand one of two">take this <kbd>space</kbd></button>
      <button type="button" id="turn-btn" hidden title="turn — the game of a golden ewe, lamb, black sheep or yearling: press it while the marker going round her is on the green and she walks away from her group; on the red she bolts; a lamb has two rings to hit, a black sheep three, a yearling four; only shown while the ring is live — space, or shift-space when it is the left-hand one of two">turn <kbd>space</kbd></button>
      <button type="button" id="so-pause-btn" hidden title="pause — freeze the confrontation where it is (the marker stops); press again to go on — P">pause</button>
      <button type="button" id="leave-it-btn" hidden title="leave it — the dog lets go of the sheep he took and every command works the whole flock again; only shown while he has one — space, or shift-space when it is the left-hand one of two">leave it <kbd>space</kbd></button>
      <button type="button" id="take-these-btn" hidden title="take these (shepherd pad, shedding on) — the small group of sheep inside the gold ring round the dog becomes his flock: every command works it alone and the outline goes round it; only shown while one is in reach (the gold ring); the line shows which group it is — space, or shift-space when it is the left-hand one of two">take these <kbd>space</kbd></button>
      <button type="button" id="take-those-btn" hidden title="take those (shepherd pad, shedding on) — with two small groups in reach, the further one: it becomes the dog's flock as take these does; the line shows which group it is — space, or shift-space when it is the left-hand one of two">take those <kbd>space</kbd></button>
      <button type="button" id="get-in-btn" hidden title="get in (shepherd pad, shedding on) — the dog runs flat out across the weak spot of the wall of sheep in front of him and splits it in two; take these and take those are then offered on the two halves; only shown while a group of more than fifteen sheep inside his pressure radius, or the group he has taken, is flat enough to split (a round one cannot be, nor the entire herd); the line shows where he will go through — space, or shift-space when it is the left-hand one of two">get in <kbd>space</kbd></button>
      <svg id="take-lines" aria-hidden="true"><line id="take-line-these" /><line id="take-line-those" /><line id="take-line-getin" /></svg>
      <button type="button" id="leave-these-btn" hidden title="leave these — the dog lets go of the group he took and every command works the whole flock again; only shown while he has one — space, or shift-space when it is the left-hand one of two">leave these <kbd>space</kbd></button>
      <div id="standoff" hidden title="the stand-off: press when the marker is in the green to nip the ram's heel — space, the nip button, or tap here">
        <div class="so-title">stand-off</div>
        <div class="so-bar">
          <div class="so-zone feint"><span>feint</span></div>
          <div class="so-zone stomp"></div>
          <div class="so-zone nip"><span>nip</span></div>
          <div class="so-mark"></div>
        </div>
      </div>
    </div>
    <div id="start-menu" hidden>
      <button type="button" id="install-btn" hidden title="add ODHD to your home screen: it then opens full screen">install pwa app</button>
      <header>
        <h1>🐑 one dude and his dog</h1>
        <p>Work the dog, gather the flock, take it out of the pasture through the gate. Pick a mode.</p>
      </header>
      <main class="versions"></main>
      <h3 class="more-title">more games</h3>
      <section class="more"></section>
      <button type="button" id="diag-btn" title="what this device and browser report to the game, to copy into a bug report">diagnostics</button>
    </div>
    <div id="install-pop" hidden>
      <div class="box" role="dialog" aria-modal="true" aria-label="install ODHD">
        <p class="msg">Install ODHD on your home screen? It then opens full screen, like an app.</p>
        <div class="btns">
          <button type="button" id="install-no">cancel</button>
          <button type="button" id="install-yes">install</button>
        </div>
      </div>
    </div>
    <div id="diag-pop" hidden>
      <div class="box" role="dialog" aria-modal="true" aria-label="diagnostics">
        <textarea readonly spellcheck="false" aria-label="diagnostics report"></textarea>
        <label class="replay-mode" title="replay mode: a button to capture the game you just played, and a list of recorded games to watch"><input type="checkbox" id="diag-replay" /> replay mode <span>capture the game you just played, watch recorded games</span></label>
        <div class="btns">
          <button type="button" id="diag-update" title="load the newest build of the game, past every cache">hard refresh</button>
          <button type="button" id="diag-close">close</button>
          <button type="button" id="diag-refresh" title="measure the page again">refresh</button>
          <button type="button" id="diag-copy">copy</button>
        </div>
      </div>
    </div>
  </body>
</html>
